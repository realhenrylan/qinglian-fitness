name: Deploy to Netlify

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend deps
        run: npm ci --prefix backend --no-audit --no-fund

      - name: Install Netlify CLI
        run: npm ci --prefix .github/netlify-cli --no-audit --no-fund

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          ./.github/netlify-cli/node_modules/.bin/netlify deploy --prod \
            --dir website \
            --functions backend/netlify/functions \
            --site ${{ vars.NETLIFY_SITE_ID }}
