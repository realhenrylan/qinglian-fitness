<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#00b578" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="轻练 - 科学训练计划与饮食记录，助你合理健身" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>轻练 · 合理健身</title>
  <script>
    // 防止深色模式闪烁：在 CSS 加载前就应用主题
    (function() {
      try {
        var t = JSON.parse(localStorage.getItem('ql_theme')) || 'auto';
        var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch(e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="loginGate" style="display:none;position:fixed;inset:0;z-index:9999;background:var(--bg,#f5f6f8);flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box">
    <div style="text-align:center;margin-bottom:28px">
      <div style="font-size:56px;line-height:1">💪</div>
      <h1 style="font-size:24px;margin:12px 0 4px">轻练</h1>
      <p style="color:var(--muted,#888);font-size:14px">合理健身 · 登录后开始使用</p>
    </div>
    <div style="width:100%;max-width:320px">
      <input id="gateUser" placeholder="用户名（3-20位字母数字）" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid var(--border,#ddd);border-radius:12px;font-size:15px;margin-bottom:10px;background:var(--card,#fff);color:var(--text,#333)" />
      <input id="gatePass" type="password" placeholder="密码（至少6位）" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid var(--border,#ddd);border-radius:12px;font-size:15px;margin-bottom:14px;background:var(--card,#fff);color:var(--text,#333)" />
      <div style="display:flex;gap:10px">
        <button id="gateLoginBtn" style="flex:1;padding:13px;border:none;border-radius:12px;font-size:15px;font-weight:600;background:#00b578;color:#fff;cursor:pointer">登录</button>
        <button id="gateRegBtn" style="flex:1;padding:13px;border:none;border-radius:12px;font-size:15px;font-weight:600;background:var(--card,#fff);color:var(--text,#333);border:1px solid var(--border,#ddd);cursor:pointer">注册</button>
      </div>
      <p style="text-align:center;color:var(--muted,#888);font-size:12px;margin-top:16px;line-height:1.5">注册后数据可云同步<br>换设备登录同一账号即可恢复全部记录</p>
    </div>
  </div>
  <div id="app"></div>
  <nav id="tabbar">
    <a data-tab="home" class="active"><span class="ticon">🏠</span><span>首页</span></a>
    <a data-tab="plan"><span class="ticon">📋</span><span>计划</span></a>
    <a data-tab="diet"><span class="ticon">🥗</span><span>饮食</span></a>
    <a data-tab="stats"><span class="ticon">📊</span><span>数据</span></a>
    <a data-tab="mine"><span class="ticon">👤</span><span>我的</span></a>
  </nav>
  <div id="toast"></div>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
