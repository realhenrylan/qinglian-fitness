<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#00b578" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="轻练 - 科学训练计划与饮食记录，助你合理健身" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>轻练 · 合理健身</title>
  <script>
    // 防止深色模式闪烁：在 CSS 加载前就应用主题
    (function() {
      try {
        var t = JSON.parse(localStorage.getItem('ql_theme')) || 'auto';
        var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch(e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app"></div>
  <nav id="tabbar">
    <a data-tab="home" class="active"><span class="ticon">🏠</span><span>首页</span></a>
    <a data-tab="plan"><span class="ticon">📋</span><span>计划</span></a>
    <a data-tab="diet"><span class="ticon">🥗</span><span>饮食</span></a>
    <a data-tab="stats"><span class="ticon">📊</span><span>数据</span></a>
    <a data-tab="mine"><span class="ticon">👤</span><span>我的</span></a>
  </nav>
  <div id="toast"></div>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
